<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 140 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="dot"></span>{{ site.title }}
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/tags/' | relative_url }}">标签</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>{{ site.author | default: site.title }}</span>
    <span class="sep">·</span>
    <span>GitHub Pages</span>
  </footer>
</body>
</html>
